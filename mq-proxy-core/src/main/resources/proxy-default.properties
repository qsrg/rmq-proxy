proxy.listenPort=10911
proxy.host=127.0.0.1
proxy.namesrvAddr=127.0.0.1:9876
proxy.storageAdapterType=mock
proxy.registerProxyToNameServer=false
proxy.proxyBrokerName=ProxyBroker
proxy.proxyClusterName=ProxyCluster
proxy.connectTimeoutMillis=3000
proxy.bossThreadNums=1
proxy.routeCacheExpireMillis=30000

# TLS配置
proxy.tlsEnabled=false
# proxy.tlsKeyStorePath=/path/to/keystore.jks
# proxy.tlsKeyStorePassword=changeit
# proxy.tlsTrustStorePath=/path/to/truststore.jks
# proxy.tlsTrustStorePassword=changeit
proxy.tlsKeyStoreType=JKS
proxy.tlsClientAuth=false
