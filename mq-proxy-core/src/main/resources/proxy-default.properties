proxy.listenPort=19876
proxy.host=127.0.0.1
proxy.namesrvAddr=127.0.0.1:9876
proxy.connectTimeoutMillis=3000
proxy.bossThreadNums=1
proxy.workerThreadNums=8
proxy.requestProcessorThreadNums=16
proxy.pullExecutorThreadNums=32
proxy.routeCacheExpireMillis=30000
proxy.upstreamClientAsyncSemaphoreValue=4096
proxy.upstreamClientChannelPoolSize=4
proxy.upstreamClientKeepAliveIntervalSeconds=30

proxy.downstream.tls.enabled=false
proxy.downstream.tls.mode=permissive
# proxy.downstream.tls.certPath=/path/to/proxy-server.crt
# proxy.downstream.tls.keyPath=/path/to/proxy-server.key
# proxy.downstream.tls.trustCertPath=/path/to/client-ca.crt
proxy.downstream.tls.clientAuth=false

# 上游 Broker TLS 配置（Proxy -> Broker）
proxy.upstream.broker.tls.enabled=false
# proxy.upstream.broker.tls.clientCertPath=/path/to/proxy-client.crt
# proxy.upstream.broker.tls.clientKeyPath=/path/to/proxy-client.key
